server {
    listen 80;
    server_name tournament.example.com;
    # Production: configure your TLS certificate and redirect HTTP to HTTPS.
    root /var/www/tournament/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri /index.php$is_args$args; }
    location ~ "^/uploads/[a-f0-9]{40}\.(png|jpg|webp)$" { try_files $uri =404; expires 7d; }
    location /uploads/ { return 404; }
    location ^~ /assets/ { try_files $uri =404; expires 1h; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
