services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tournament
      MYSQL_USER: tournament
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/runtime-grants.sql:/docker-entrypoint-initdb.d/02-grants.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
  php:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      DB_HOST: db
      DB_DATABASE: tournament
      DB_USERNAME: tournament
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_SECURE: ${SESSION_SECURE:-0}
    volumes:
      - uploads:/var/www/tournament/public/uploads
    depends_on:
      db:
        condition: service_healthy
  web:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./public:/var/www/tournament/public:ro
      - uploads:/var/www/tournament/public/uploads:ro
      - ./deploy/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
volumes:
  mysql-data:
  uploads:
